name: pro_companion_core
description: >-
  The local core (ADR 001): the event envelope, the append-only store (ADR 002)
  and the async message interface the UI reaches it by (ADR 003). Pure Dart -
  no Flutter and no network.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.12.2

resolution: workspace

dependencies:
  # SHA-256 for the per-device hash chain (#28). Pinned to the version the
  # workspace already resolves for the scoring vectors' checksums (#83).
  crypto: 3.0.7
  sqlite3: 3.0.0

dev_dependencies:
  lints: any
  test: any
