name: CI

on:
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true
      - run: flutter --version
      # Fatal on errors, warnings and infos (flutter analyze's defaults).
      - run: flutter analyze
      - run: flutter test
      # The local core (#24) is a pure-Dart workspace package; the root's
      # flutter test does not run its tests.
      - run: dart test
        working-directory: packages/core
      - run: flutter build apk --debug

  # Server-facing tests (#41) against a local Supabase built from this repo's own
  # migrations (ADR 005). supabase start applies every file under
  # supabase/migrations to a fresh database, and db reset applies them again from
  # empty, so a migration that fails to apply fails the job. The whole suite then
  # runs with PRO_COMPANION_LOCAL_STACK=1, which un-skips every local-stack test
  # with nothing to register; the rest run a second time, beside the emulator job.
  local-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # ghcr.io refused supabase start's pulls across whole runs on 2026-09-23 while
      # ECR served them. ECR throttles too: a start that dies in under a minute
      # pulling images is a rerun, not a finding.
      SUPABASE_INTERNAL_IMAGE_REGISTRY: public.ecr.aws
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true
      # The CLI is pinned, and the owner script's readLocalStatus runs the same version.
      - name: Start the local stack from supabase/migrations
        run: npx --yes supabase@2.117.0 start -x studio,imgproxy,inbucket,mailpit,edge-runtime,logflare,vector,supavisor
      - name: Reset the database, applying every migration again
        run: npx --yes supabase@2.117.0 db reset --local
      - run: flutter test
        env:
          PRO_COMPANION_LOCAL_STACK: "1"

  # On-device tests (#16): force-kill, headless-core and manifest criteria can
  # only be proven on Android, so every integration_test/ file runs here on an
  # API 34 emulator. Standard 2-vCPU Linux runners get KVM once the udev rule
  # below grants it (GitHub changelog 2024-04-02); without it the emulator
  # falls back to software and does not boot in any useful time.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.9"
          cache: true
      - run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # google_apis rather than default: it carries the Google permission
      # controller real phones ship, which #14's permission test drives.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # Each line runs as its own `sh -c`. The force-kill criterion (#24)
          # needs two app processes and a kill between them, so a script
          # drives it rather than the plain sweep.
          script: |
            flutter test integration_test -d emulator-5554
            sh integration_test/force_kill.sh emulator-5554
